name: Release

# Publishing is gated. `workflow_dispatch` defaults to a dry run, so the whole
# pipeline can be exercised before anything reaches the registry. Flip the
# `publish` input, or push a v* tag, to actually ship.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm (otherwise dry run)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The full matrix has to be green: a release must not be the first place a
  # runtime regression shows up.
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # Trusted publishing needs npm >= 11.5.1; do not rely on what Node ships.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run build

      # A tag that disagrees with package.json ships the wrong version silently.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          jsr="$(node -p 'require("./jsr.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package.json $pkg" >&2
            exit 1
          fi
          if [ "$tag" != "$jsr" ]; then
            echo "tag $tag does not match jsr.json $jsr" >&2
            exit 1
          fi

      - run: npx --yes publint
      - run: npx --yes @arethetypeswrong/cli --pack . --profile esm-only

      # Trusted publishing: npm mints a short-lived token from the OIDC claim,
      # so there is no NPM_TOKEN, and provenance is attached automatically.
      - name: Publish
        run: |
          if [ "$PUBLISH" = "true" ]; then
            npm publish --access public
          else
            echo "Dry run: set the publish input, or push a v* tag, to ship."
            npm publish --access public --dry-run
          fi
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}

  jsr:
    needs: [verify, release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Publish
        run: |
          if [ "$PUBLISH" = "true" ]; then
            npx --yes jsr publish
          else
            echo "Dry run: set the publish input, or push a v* tag, to ship."
            npx --yes jsr publish --dry-run
          fi
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
